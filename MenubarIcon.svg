<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .petal { fill: #e8e8e4; stroke: #999999; }
        .center { fill: #d4a574; stroke: #666666; }
      }
      @media (prefers-color-scheme: light) {
        .petal { fill: #333333; stroke: #555555; }
        .center { fill: #666666; stroke: #333333; }
      }
    </style>
  </defs>

  <!-- Outer petals (6 petals simplified) -->
  <!-- Top -->
  <ellipse cx="9" cy="2.5" rx="1.8" ry="2.2" class="petal"/>
  <!-- Top-right -->
  <ellipse cx="13" cy="4" rx="1.8" ry="2.2" class="petal" transform="rotate(60 13 4)"/>
  <!-- Bottom-right -->
  <ellipse cx="13" cy="14" rx="1.8" ry="2.2" class="petal" transform="rotate(120 13 14)"/>
  <!-- Bottom -->
  <ellipse cx="9" cy="15.5" rx="1.8" ry="2.2" class="petal"/>
  <!-- Bottom-left -->
  <ellipse cx="5" cy="14" rx="1.8" ry="2.2" class="petal" transform="rotate(-120 5 14)"/>
  <!-- Top-left -->
  <ellipse cx="5" cy="4" rx="1.8" ry="2.2" class="petal" transform="rotate(-60 5 4)"/>

  <!-- Inner petals (3) -->
  <!-- Top -->
  <ellipse cx="9" cy="5" rx="1.2" ry="1.5" class="petal" opacity="0.75"/>
  <!-- Bottom-right -->
  <ellipse cx="12" cy="11" rx="1.2" ry="1.5" class="petal" opacity="0.75" transform="rotate(120 12 11)"/>
  <!-- Bottom-left -->
  <ellipse cx="6" cy="11" rx="1.2" ry="1.5" class="petal" opacity="0.75" transform="rotate(-120 6 11)"/>

  <!-- Center -->
  <circle cx="9" cy="9" r="1.5" class="center"/>
</svg>